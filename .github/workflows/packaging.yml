name: deb packaging

on:
  push:
    tags:
      - 'debian/*.*.*-*'
      - 'test/*'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Consolidated ceiling for the whole pipeline; each reusable workflow self-restricts to what it needs.
permissions:
  contents: write
  id-token: write
  attestations: write
  security-events: write
  actions: read

jobs:

  security:
    # Lint the workflows for security issues (zizmor). The expensive build is gated on this passing,
    # so a finding halts the run before anything is built.
    name: GHA security analysis (zizmor)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7

  build:
    needs: [security]
    uses: dionysius/gbp-gha/.github/workflows/build.yml@main
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    with:
      # https://github.com/orgs/community/discussions/26671
      DEBFULLNAME: dionysius (github-actions)
      DEBEMAIL: dragon.dionysius+gha@gmail.com
      images: '["debian:stable", "ubuntu:latest"]'
      architectures: '["amd64", "arm64"]'
      before_build_deps_install: |
        apt-get install -y curl
        curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
        . /etc/os-release
        curl -fsSL "https://build.opensuse.org/projects/home:dionysius:immich/signing_keys/download?kind=gpg" | tee /etc/apt/keyrings/obs-dionysius.asc
        dist="${ID^}_${VERSION_ID}"
        [[ "$dist" == Ubuntu* ]] && dist="x${dist}"
        echo "deb [signed-by=/etc/apt/keyrings/obs-dionysius.asc] https://download.opensuse.org/repositories/home:/dionysius:/immich/$dist/ /" | tee /etc/apt/sources.list.d/obs-dionysius.list
        apt-get update

  test:
    # Install the built .deb artifacts into a real systemd instance (incus container + amd64 VM per
    # distro) and boot immich; gates the release. See test.yml and .github/test/.
    needs: [build]
    uses: ./.github/workflows/test.yml
    with:
      build_matrix: ${{ needs.build.outputs.matrix }}

  publish:
    # Create the GitHub release from the built artifacts, then promote it after a delay. See publish.yml.
    if: startsWith(github.event.ref, 'refs/tags/debian')
    needs: [build, test]
    uses: ./.github/workflows/publish.yml
